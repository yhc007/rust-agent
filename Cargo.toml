[package]
name = "rust-agent"
version = "0.1.0"
edition = "2021"
description = "Rust-based AI Agent Core Engine"
authors = ["Paul Yu <yhc007@gmail.com>"]
repository = "https://github.com/yhc007/rust-agent"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Streaming
tokio-stream = "0.1"
futures = "0.3"
eventsource-stream = "0.2"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# Embedded web server for the agent-stream UI (rust-agent serve)
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# File watching
notify = "7"

# Fuzzy search
fuzzy-matcher = "0.3"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Shell parsing (for AST security)
tree-sitter = "0.24"
tree-sitter-bash = "0.23"

# Process management
nix = { version = "0.29", features = ["process", "signal"] }

# Directory walking
walkdir = "2"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"

# Template (for prompts)
minijinja = "2"

# CoreDB (Cassandra-compatible) driver — used by polymarket-btc subsystem
scylla = "0.15"

# Regex for threshold extraction in backtest baseline
regex = "1"

# EIP-712 signing for the Polymarket CLOB live executor. We pull only
# the signer + sol-types features; no provider / RPC bits are needed
# while the live path is sign-only. hex is used to parse the
# POLYMARKET_PRIVATE_KEY env var.
alloy = { version = "0.8", default-features = false, features = [
    "signer-local",
    "sol-types",
    "contract",
    "providers",
    "network",
    "rpc-types-eth",
    "reqwest",
] }
hex = "0.4"

# HMAC-SHA256 for Polymarket CLOB L2 request signatures.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "rust-agent"
path = "src/main.rs"
